name: GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "documentation/**"
      - "images/image1.png"
      - "images/image2.png"
      - "images/github-social-preview.jpg"
      - "images/demo/dimmerly-demo-light.mp4"
      - "images/demo/dimmerly-demo-dark.mp4"
      - "images/demo/dimmerly-demo-light-poster.jpg"
      - "images/demo/dimmerly-demo-dark-poster.jpg"
      - "IconComposerLayers/AppIcon-IconComposer/rendered/icon_128x128@2x.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare public site
        run: |
          set -euo pipefail
          mkdir -p build/pages/assets
          cp documentation/index.html build/pages/index.html
          cp documentation/external-monitor-brightness.html build/pages/external-monitor-brightness.html
          cp documentation/multi-monitor-control.html build/pages/multi-monitor-control.html
          cp documentation/ddc-ci-not-working.html build/pages/ddc-ci-not-working.html
          cp documentation/compare-mac-display-apps.html build/pages/compare-mac-display-apps.html
          cp documentation/support.html build/pages/support.html
          cp documentation/app-store-support.html build/pages/app-store-support.html
          cp documentation/app-store-privacy.html build/pages/app-store-privacy.html
          cp documentation/privacy-policy.html build/pages/privacy-policy.html
          cp documentation/404.html build/pages/404.html
          cp documentation/site.css build/pages/site.css
          cp documentation/site.js build/pages/site.js
          cp documentation/robots.txt build/pages/robots.txt
          cp documentation/sitemap.xml build/pages/sitemap.xml
          cp images/image1.png build/pages/assets/dimmerly-menu.png
          cp images/image2.png build/pages/assets/dimmerly-settings.png
          cp images/github-social-preview.jpg build/pages/assets/dimmerly-social-preview.jpg
          cp images/demo/dimmerly-demo-light.mp4 build/pages/assets/dimmerly-demo-light.mp4
          cp images/demo/dimmerly-demo-dark.mp4 build/pages/assets/dimmerly-demo-dark.mp4
          cp images/demo/dimmerly-demo-light-poster.jpg build/pages/assets/dimmerly-demo-light-poster.jpg
          cp images/demo/dimmerly-demo-dark-poster.jpg build/pages/assets/dimmerly-demo-dark-poster.jpg
          cp IconComposerLayers/AppIcon-IconComposer/rendered/icon_128x128@2x.png build/pages/assets/dimmerly-icon.png
          cp images/badges/download-on-the-mac-app-store-black.svg build/pages/assets/download-on-the-mac-app-store-black.svg
          cp images/badges/download-on-the-mac-app-store-white.svg build/pages/assets/download-on-the-mac-app-store-white.svg
          touch build/pages/.nojekyll

      - name: Inject Cloudflare Web Analytics token
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_WEB_ANALYTICS_TOKEN"
          for page in build/pages/*.html; do
            sed -i "s|__CLOUDFLARE_WEB_ANALYTICS_TOKEN__|$CLOUDFLARE_WEB_ANALYTICS_TOKEN|g" "$page"
          done

          test -s build/pages/index.html
          test -s build/pages/external-monitor-brightness.html
          test -s build/pages/multi-monitor-control.html
          test -s build/pages/ddc-ci-not-working.html
          test -s build/pages/compare-mac-display-apps.html
          test -s build/pages/support.html
          test -s build/pages/app-store-support.html
          test -s build/pages/app-store-privacy.html
          test -s build/pages/privacy-policy.html
          test -s build/pages/404.html
          test -s build/pages/site.css
          test -s build/pages/site.js
          test -s build/pages/robots.txt
          test -s build/pages/sitemap.xml
          test -s build/pages/assets/dimmerly-menu.png
          test -s build/pages/assets/dimmerly-settings.png
          test -s build/pages/assets/dimmerly-social-preview.jpg
          test -s build/pages/assets/dimmerly-demo-light.mp4
          test -s build/pages/assets/dimmerly-demo-dark.mp4
          test -s build/pages/assets/dimmerly-demo-light-poster.jpg
          test -s build/pages/assets/dimmerly-demo-dark-poster.jpg
          test -s build/pages/assets/dimmerly-icon.png
          test -s build/pages/assets/download-on-the-mac-app-store-black.svg
          test -s build/pages/assets/download-on-the-mac-app-store-white.svg
          for page in build/pages/*.html; do
            test "$(grep -c 'https://static.cloudflareinsights.com/beacon.min.js' "$page")" -eq 1
            grep -q 'data-cf-beacon' "$page"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
