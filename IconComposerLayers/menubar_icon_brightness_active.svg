<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dimmerly menu bar icon, active state: shown while Dimmerly is affecting the displays.
       Four rays instead of the idle icon's eight - "less light" carried by ray count.
       Every stroke stays at full opacity on purpose: a faded menu bar glyph reads as a
       disabled control, which is the opposite of what this state means. The four rays
       are evenly spaced so the icon never looks clipped or half-drawn. -->
  <circle cx="18" cy="18" r="6.4" fill="#000000"/>
  <g stroke="#000000" stroke-width="2.4" stroke-linecap="round">
    <line x1="18" y1="3.4" x2="18" y2="7.6"/>
    <line x1="32.6" y1="18" x2="28.4" y2="18"/>
    <line x1="18" y1="32.6" x2="18" y2="28.4"/>
    <line x1="3.4" y1="18" x2="7.6" y2="18"/>
  </g>
</svg>
