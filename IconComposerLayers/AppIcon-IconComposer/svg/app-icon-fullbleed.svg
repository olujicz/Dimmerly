<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dimmerly app icon - FLATTENED, edgeless reference.
       Same art as the shipping icon but square and full-bleed: no rounded-corner
       clip, no outer rim stroke, no drop shadow. The dim rays have the layer's
       0.42 opacity baked in. Reference only - the app builds from default.icon. -->
  <defs>
    <linearGradient id="bg" x1="84" y1="84" x2="923" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#324B6B"/>
      <stop offset="0.52" stop-color="#294464"/>
      <stop offset="1" stop-color="#1A2F4B"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(482 360) rotate(77) scale(680 600)">
      <stop stop-color="#8ED8FF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8ED8FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) rotate(90) scale(300)">
      <stop stop-color="#9DE0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9DE0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="330" y1="380" x2="694" y2="644" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF7FF"/>
      <stop offset="0.42" stop-color="#7FC6FF"/>
      <stop offset="0.72" stop-color="#2C63A0"/>
      <stop offset="1" stop-color="#16304F"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#aurora)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g stroke="#EAF7FF" stroke-linecap="round" stroke-width="26">
    <line x1="512" y1="150" x2="512" y2="232" stroke-opacity="1"/>
    <line x1="286" y1="286" x2="344" y2="344" stroke-opacity="0.95"/>
    <line x1="150" y1="512" x2="232" y2="512" stroke-opacity="0.95"/>
    <line x1="738" y1="286" x2="680" y2="344" stroke-opacity="0.7"/>
  </g>
  <g stroke="#EAF7FF" stroke-linecap="round" stroke-width="21">
    <line x1="303" y1="721" x2="344" y2="680" stroke-opacity="0.21"/>
    <line x1="512" y1="849" x2="512" y2="792" stroke-opacity="0.168"/>
    <line x1="721" y1="721" x2="680" y2="680" stroke-opacity="0.126"/>
    <line x1="849" y1="512" x2="792" y2="512" stroke-opacity="0.176"/>
  </g>

  <circle cx="512" cy="512" r="182" fill="url(#disc)"/>
  <circle cx="512" cy="512" r="182" stroke="#E2F6FF" stroke-opacity="0.5" stroke-width="4"/>
</svg>
